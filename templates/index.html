<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Path UI</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
        #saga-map { width: 100vw; height: 100vh; display: block; }
        
        .stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            
            /* --- CHANGE THESE VALUES --- */
            padding: 20px;          /* Increase inner spacing */
            width: 250px;           /* Increase the width (was 180px) */
            font-size: 1.1rem;      /* Increase text size (was 0.8rem) */
            /* ---------------------------- */

            border-radius: 12px;
            border: 1px solid #444;
            font-family: monospace;
            z-index: 100;
        }
        /* Optional: Make the individual lines taller */
        .stat-line { 
            display: flex; 
            justify-content: space-between; 
            gap: 20px; 
            margin: 10px 0; /* Increased margin for better breathing room */
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 500px;
            pointer-events: none;
        }

        .question-card {
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #444;
            text-align: center;
            transition: opacity 0.5s;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .question { font-size: 1.2rem; margin-bottom: 20px; }
        .choices { display: flex; flex-direction: column; gap: 10px; }
        
        .choice-btn {
            background: #333;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #555;
        }
        .choice-btn:hover { background: #444; border-color: #fff; }
        .choice-btn.disabled { opacity: 0.5; pointer-events: none; }

        #restart-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #4CAF50;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
        }
    </style>
</head>
<body>
<div class="stats-panel">
    <div style="color: #888; margin-bottom: 10px; font-size: 0.8rem;">REAL-TIME TRAITS</div>
    <div class="stat-line">Personality: <span id="s-pers" class="stat-val">0</span></div>
    <div class="stat-line">Behavior: <span id="s-beha" class="stat-val">0</span></div>
    <div class="stat-line">Skills: <span id="s-skil" class="stat-val">0</span></div>
    <div class="stat-line">Market: <span id="s-mark" class="stat-val">0</span></div>
</div>
    <canvas id="saga-map"></canvas>

    <div class="ui-overlay">
        <div class="question-card">
            <div class="question" id="question-text">Loading Journey...</div>
            <div class="choices" id="choices-container"></div>
        </div>
    </div>

    <button id="restart-btn">Restart Journey</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('saga-map');
            const ctx = canvas.getContext('2d');
            const questionEl = document.getElementById('question-text');
            const choicesEl = document.getElementById('choices-container');
            const questionCard = document.querySelector('.question-card');
            const restartBtn = document.getElementById('restart-btn');

            let nodePositions = {};
            let activeNodeId = 1;
            let ephemeralLinks = []; 
            let rejectedPaths = [];
            let state = 'INIT'; 
            let animationStartTime = 0;
            let cameraOffset = { x: 0, y: 0 };
            let targetOffset = { x: 0, y: 0 };

            restartBtn.onclick = resetApp;

            async function resetApp() {
                try {
                    const res = await fetch('/start', { method: 'POST' });
                    const data = await res.json();
                    
                    nodePositions = {};
                    ephemeralLinks = [];
                    rejectedPaths = [];
                    activeNodeId = data.node_id;
                    
                    nodePositions[activeNodeId] = { 
                        internalId: activeNodeId, 
                        x: 0, y: 0, 
                        color: data.color,
                        isRevealed: true,
                        children: []
                    };

                    panCameraToNode(activeNodeId, false);
                    renderQuestion(data);
                    generateAndShowNextChoices(nodePositions[activeNodeId]);
                } catch (e) {
                    questionEl.textContent = "Error connecting to server. Make sure app.py is running!";
                }
            }

            function renderQuestion(data) {
    if (data.end) {
        questionEl.innerHTML = "<h2>Zenith Reached</h2><p>Your Career Persona is being analyzed...</p>";
        choicesEl.innerHTML = `<button class="choice-btn" onclick="location.reload()">Start New Journey</button>`;
        return;
    }

    // Update Scores in UI
    if (data.trait_summary) {
        const sum = (obj) => Object.values(obj).reduce((a, b) => a + b, 0);
        document.getElementById('s-pers').textContent = sum(data.trait_summary.personality);
        document.getElementById('s-beha').textContent = sum(data.trait_summary.behavior);
        document.getElementById('s-skil').textContent = sum(data.trait_summary.skills);
        document.getElementById('s-mark').textContent = sum(data.trait_summary.market);
    }

    // Rest of your existing renderQuestion code...
    questionCard.style.opacity = 0;
    setTimeout(() => {
        questionEl.innerHTML = `<small style="color:${data.color}">${data.phase}</small><br>${data.question}`;
        choicesEl.innerHTML = '';
        data.choices.forEach((text, i) => {
            const btn = document.createElement('div');
            btn.classList.add('choice-btn');
            btn.textContent = text;
            btn.onclick = () => handleChoice(i);
            choicesEl.appendChild(btn);
        });
        questionCard.style.opacity = 1;
    }, 500);
}

            async function handleChoice(index) {
                if (state !== 'AWAITING_CHOICE') return;
                
                const res = await fetch('/next', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ choice_index: index })
                });
                const nextData = await res.json();

                const chosenIndex = index % ephemeralLinks.length;
                ephemeralLinks[chosenIndex].isChosen = true;

                state = 'CHOOSING';
                animationStartTime = performance.now();
                window.nextQuestionData = nextData;
                requestAnimationFrame(animationLoop);
            }

            function generateAndShowNextChoices(parentNode) {
    const distance = 200;
    const verticalSpread = 150; // Increased spread for 4 nodes

    // Create 4 paths forward (Top to Bottom)
    ephemeralLinks = [0, 1, 2, 3].map((_, i) => {
        // Calculate y-offset so the 4 nodes are centered vertically
        const yOffset = (i - 1.5) * (verticalSpread / 1.5); 
        return {
            from: parentNode,
            to: {
                internalId: parentNode.internalId + 1,
                x: parentNode.x + distance,
                y: parentNode.y + yOffset
            },
            progress: 0,
            isChosen: false,
            fadeOutProgress: 0
        };
    });
    
    state = 'GENERATING';
    animationStartTime = performance.now();
    requestAnimationFrame(animationLoop);
}

            function animationLoop(timestamp) {
                const elapsedTime = timestamp - animationStartTime;

                if (state === 'GENERATING') {
                    const progress = Math.min(elapsedTime / 800, 1);
                    ephemeralLinks.forEach(link => link.progress = progress);
                    if (progress >= 1) state = 'AWAITING_CHOICE';
                } 
                else if (state === 'CHOOSING') {
                    const progress = Math.min(elapsedTime / 1000, 1);
                    ephemeralLinks.forEach(link => { if (!link.isChosen) link.fadeOutProgress = progress; });
                    if (progress >= 1) {
                        const chosenLink = ephemeralLinks.find(l => l.isChosen);
                        state = 'PANNING';
                        panCameraToNode(chosenLink.to.internalId, true, chosenLink.to);
                    }
                } 
                else if (state === 'PANNING') {
                    cameraOffset.x += (targetOffset.x - cameraOffset.x) * 0.08;
                    cameraOffset.y += (targetOffset.y - cameraOffset.y) * 0.08;
                    
                    if (Math.abs(targetOffset.x - cameraOffset.x) < 1) {
                        const chosenLink = ephemeralLinks.find(l => l.isChosen);
                        const newNode = { ...chosenLink.to, children: [], isRevealed: true, color: window.nextQuestionData.color };
                        
                        nodePositions[newNode.internalId] = newNode;
                        nodePositions[chosenLink.from.internalId].children.push(newNode.internalId);
                        
                        ephemeralLinks.forEach(link => { if (!link.isChosen) rejectedPaths.push(link); });

                        activeNodeId = newNode.internalId;
                        ephemeralLinks = [];
                        renderQuestion(window.nextQuestionData);
                        generateAndShowNextChoices(newNode);
                    }
                }
                draw();
                if (state !== 'AWAITING_CHOICE') requestAnimationFrame(animationLoop);
            }

            function panCameraToNode(nodeId, animate, tempNode) {
                let node = nodePositions[nodeId] || tempNode;
                targetOffset.x = -node.x;
                targetOffset.y = -node.y;
                if (!animate) cameraOffset = { ...targetOffset };
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.translate(cameraOffset.x, cameraOffset.y);

                // Connections
                for (const id in nodePositions) {
                    const node = nodePositions[id];
                    node.children.forEach(cId => {
                        const child = nodePositions[cId];
                        drawConnector(node.x, node.y, child.x, child.y, 1);
                    });
                }
                rejectedPaths.forEach(l => drawConnector(l.from.x, l.from.y, l.to.x, l.to.y, 0.1));

                ephemeralLinks.forEach(l => {
                    const eX = l.from.x + (l.to.x - l.from.x) * l.progress;
                    const eY = l.from.y + (l.to.y - l.from.y) * l.progress;
                    drawConnector(l.from.x, l.from.y, eX, eY, 1 - l.fadeOutProgress);
                    if (l.progress >= 1) drawNode(l.to.x, l.to.y, false, 1 - l.fadeOutProgress, '#555');
                });

                // Nodes
                for (const id in nodePositions) {
                    const n = nodePositions[id];
                    drawNode(n.x, n.y, n.internalId === activeNodeId, 1, n.color);
                }
                ctx.restore();
            }

            function drawNode(x, y, isActive, opacity, color) {
                ctx.globalAlpha = opacity;
                ctx.beginPath();
                ctx.arc(x, y, isActive ? 15 : 10, 0, 2 * Math.PI);
                ctx.fillStyle = color || '#ccc';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = isActive ? 3 : 1;
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            function drawConnector(sX, sY, eX, eY, op) {
                ctx.globalAlpha = op;
                ctx.beginPath();
                ctx.moveTo(sX, sY);
                ctx.lineTo(eX, eY);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                panCameraToNode(activeNodeId, false);
                draw();
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            resetApp(); 
        });
    </script>
</body>
</html>
